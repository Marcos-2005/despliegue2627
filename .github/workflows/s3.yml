name: Copia a S3

on:
  push:
    branches: [ main ]

jobs:
  deploy-s3:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4
      
      - name: Comprobar secretos
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          [ -n "$AWS_ACCESS_KEY_ID" ] && echo "Access key: OK" || echo "Access key: FALTA"
          [ -n "$AWS_SECRET_ACCESS_KEY" ] && echo "Secret key: OK" || echo "Secret key: FALTA"
          [ -n "$AWS_SESSION_TOKEN" ] && echo "Session token: OK" || echo "Session token: VACÍO"
          [ -n "$AWS_REGION" ] && echo "Region: OK" || echo "Region: FALTA"

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Copiar los archivos al bucket
        run: |
          aws s3 sync . s3://${{ secrets.S3_BUCKET }} --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "node_modules/*" \
            --exclude "tests/*" \
            --exclude "package*.json" \
            --exclude "*.cjs"

      - name: Mostrar el contenido del bucket
        run: aws s3 ls s3://${{ secrets.S3_BUCKET }} --recursive